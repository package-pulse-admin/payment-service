spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3307/order_platform
    username: order_user
    password: order_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8081

management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

payment-service:
  payment:
    kafka:
      transaction-created-topic:
      group-id: payment-service
      payment-notification-topic: payment-notification_topic
    paypal:
      base-url: https://api-m.sandbox.paypal.com
      client-id: xxx
      client-secret: xxx

logging:
  level:
    com.mihaela.orderplatform: DEBUG

